<svg width="490" height="204" viewBox="0 0 490 204" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow6" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="490" height="204" rx="12" fill="url(#bg6)"/>
  <!-- Border -->
  <rect width="490" height="204" rx="12" fill="none"
        stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.35"/>
  <!-- Left accent bar -->
  <rect x="0" y="20" width="3.5" height="164" rx="2" fill="#60A5FA"/>
  <!-- Accent corner dot -->
  <circle cx="472" cy="18" r="5" fill="#2563EB" fill-opacity="0.6"
          filter="url(#glow6)"/>

  <!-- Category badge -->
  <rect x="14" y="12" width="123" height="21" rx="10"
        fill="#2563EB" fill-opacity="0.18"/>
  <text x="24" y="27"
        font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
        font-size="10.5" font-weight="700" fill="#60A5FA"
        letter-spacing="0.3">⚡ Tech Advances</text>

  <!-- Title line 1 -->
  <text x="14" y="57"
        font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#E6EDF3">The 4 Best Monitor Arms to Clear Up Your Desk Space</text>
  <!-- Title line 2 -->
  <text x="14" y="75"
        font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#E6EDF3">(2026)</text>
  <!-- Author & date -->
  <text x="14" y="97"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#60A5FA">&#9997;&#65039; Luke Larsen &#183; Aug 22, 2026</text>
  <!-- Excerpt line 1 -->
  <text x="14" y="117"
        font-family="'Segoe UI', Georgia, serif"
        font-size="11" fill="#8B949E" font-style="italic">&#8220;Your desk setup needs a monitor arm, and I’ve been testing</text>
  <!-- Excerpt line 2 -->
  <text x="14" y="133"
        font-family="'Segoe UI', Georgia, serif"
        font-size="11" fill="#8B949E" font-style="italic">every one I can get my hands on to find the best.&#8221;</text>
  <!-- Footer -->
  <line x1="14" y1="147" x2="476" y2="147"
        stroke="#21262d" stroke-width="1"/>
  <text x="14" y="160"
        font-family="'Courier New', 'Fira Code', monospace"
        font-size="9.5" fill="#484F58">&#128279; WIRED &#183; &#128336; Updated 09:43 UTC</text>

</svg>