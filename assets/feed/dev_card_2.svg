  <!-- Excerpt line 1 -->
  <text x="14" y="99"
        font-family="'Segoe UI', Georgia, serif"
        font-size="11" fill="#8B949E" font-style="italic">&#8220;上一篇 的链路里，大模型只干两件事：看标题勾编号，再根据勾中的正文写答复。 这两件事对模型的要求很不一样。勾选要读完整份</text>
  <!-- Excerpt line 2 -->
  <text x="14" y="115"
        font-family="'Segoe UI', Georgia, serif"
        font-size="11" fill="#8B949E" font-style="italic">标题和摘要，输出往往只有十几个字。作答读的是两三条全文，输出是一段话。所以换模型时，先看的不该是「…&#8221;</text>
  <!-- Footer -->
  <line x1="14" y1="129" x2="476" y2="129"
        stroke="#21262d" stroke-width="1"/>
  <text x="14" y="142"
        font-family="'Courier New', 'Fira Code', monospace"
        font-size="9.5" fill="#484F58">&#128279; DEV Community &#183; &#128336; Updated 07:58 UTC</text>

</svg>