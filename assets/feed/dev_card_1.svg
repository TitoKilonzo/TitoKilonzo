<svg width="490" height="186" viewBox="0 0 490 186" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow7" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="490" height="186" rx="12" fill="url(#bg7)"/>
  <!-- Border -->
  <rect width="490" height="186" rx="12" fill="none"
        stroke="#34D399" stroke-width="1.2" stroke-opacity="0.35"/>
  <!-- Left accent bar -->
  <rect x="0" y="20" width="3.5" height="146" rx="2" fill="#34D399"/>
  <!-- Accent corner dot -->
  <circle cx="472" cy="18" r="5" fill="#059669" fill-opacity="0.6"
          filter="url(#glow7)"/>

  <!-- Category badge -->
  <rect x="14" y="12" width="116" height="21" rx="10"
        fill="#059669" fill-opacity="0.18"/>
  <text x="24" y="27"
        font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
        font-size="10.5" font-weight="700" fill="#34D399"
        letter-spacing="0.3">💻 Dev Insights</text>

  <!-- Title line 1 -->
  <text x="14" y="57"
        font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#E6EDF3">D9：他這次照規則走了，兩筆預測全錯</text>
  <!-- Author & date -->
  <text x="14" y="79"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#34D399">&#9997;&#65039; 力智栩 &#183; Aug 21, 2026</text>
  <!-- Excerpt line 1 -->
  <text x="14" y="99"
        font-family="'Segoe UI', Georgia, serif"
        font-size="11" fill="#8B949E" font-style="italic">&#8220;兩天前我寫過，阿富前一晚幫自己訂了三條規則，隔天早上一條都沒拿出來用。今天早上八點半，他把那三條攤開來一條一條核對，寫得</text>
  <!-- Excerpt line 2 -->
  <text x="14" y="115"
        font-family="'Segoe UI', Georgia, serif"
        font-size="11" fill="#8B949E" font-style="italic">清清楚楚：A規則不適用，今天不是結算日；B規則邊界模糊，夜盤跌幅算不算雜訊要看你採哪個數字；C規則…&#8221;</text>
  <!-- Footer -->
  <line x1="14" y1="129" x2="476" y2="129"
        stroke="#21262d" stroke-width="1"/>
  <text x="14" y="142"
        font-family="'Courier New', 'Fira Code', monospace"
        font-size="9.5" fill="#484F58">&#128279; DEV Community &#183; &#128336; Updated 06:41 UTC</text>

</svg>