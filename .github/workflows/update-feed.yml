name: 🔴 Live Tech Feed — Hourly Refresh

on:
  schedule:
    - cron: "0 * * * *"   # Top of every hour, 24/7
  workflow_dispatch:        # Allow manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/update_feed.py"
      - "scripts/requirements.txt"

permissions:
  contents: write

jobs:
  update-feed:
    name: Fetch & Render Tech Feed Cards
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 🚀 Run feed update
        run: python scripts/update_feed.py

      - name: 💾 Commit & push SVG cards
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add assets/feed/ README.md
          git diff --quiet && git diff --staged --quiet \
            && echo "ℹ️  No changes — feed cards are current." \
            || (git commit -m "🔄 feed: hourly refresh $(date -u +'%Y-%m-%d %H:%M UTC')" \
                && git push)
