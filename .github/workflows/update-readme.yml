name: 🔄 Live README Feed

on:
  schedule:
    - cron: "0 * * * *"   # Every hour at :00
  workflow_dispatch:        # Manual trigger from Actions tab

# NO push: trigger — that would cause an infinite commit loop

jobs:
  update-readme:
    name: Fetch Feeds & Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push the README commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update README
        env:
          # Add GH_TOKEN secret in repo Settings → Secrets for 5000 req/hr API limit
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add README.md
          git diff --cached --quiet \
            || git commit -m "chore(readme): 🤖 live update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]" \
            && git push
