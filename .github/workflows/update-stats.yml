name: 📊 GitHub Stats — Daily Cache

on:
  schedule:
    - cron: "30 0 * * *"  # 00:30 UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-stats:
    name: Download & Cache GitHub Stats SVGs
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🚀 Cache stats SVGs
        run: python scripts/update_stats.py

      - name: 🐍 Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-stats/github-contribution-grid-snake.svg?palette=github-light&color_snake=#A78BFA
            assets/github-stats/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A78BFA

      - name: 💾 Commit & push cached SVGs
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add assets/github-stats/
          git diff --quiet && git diff --staged --quiet \
            && echo "ℹ️  Stats are current, nothing to commit." \
            || (git commit -m "📊 stats: daily cache refresh $(date -u +'%Y-%m-%d')" \
                && git push)
